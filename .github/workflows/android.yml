# Builds the native Twain Android app (mobile/) on every change to mobile/, or by hand from the Actions tab.
# When mobile/app.json has a new expo.version, it publishes release app-v<version> with Twain.apk and the
# app-version.json the in-app updater reads (twain-coral.vercel.app/app-version.json redirects to it).
# Signing needs four repo secrets
# (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Without them it still builds, but signed with a throwaway debug key (fine to try, not for Play).
name: Android app

on:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write # to publish the GitHub release with the APK

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci
      - run: npx tsc --noEmit && npx expo lint

      - name: Generate the Android project
        run: npx expo prebuild -p android --no-install
        env:
          CI: 1

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing secrets set — release is signed with the debug key."
          fi

      - name: Build APK and AAB
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # Phone CPUs only (no x86 emulator builds): keeps the APK people download about half the size.
        run: ./gradlew assembleRelease bundleRelease --no-daemon -PreactNativeArchitectures=armeabi-v7a,arm64-v8a

      # A new version in mobile/app.json becomes a release; the app's update check reads its app-version.json.
      - name: Prepare release files
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./app.json').expo.version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh release view "app-v$V" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"; echo "app-v$V is already released; bump expo.version to publish."
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
          OUT=android/app/build/outputs/apk/release
          cp "$OUT/app-release.apk" "$OUT/Twain.apk"
          node -e '
            const c = require("./app.json").expo, fs = require("fs");
            const notes = fs.existsSync("release-notes.txt") ? fs.readFileSync("release-notes.txt", "utf8").trim() : "";
            fs.writeFileSync(process.argv[1], JSON.stringify({
              versionCode: c.android.versionCode, version: c.version, notes, minVersionCode: 1,
              url: `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/app-v${c.version}/Twain.apk`,
            }, null, 2));
          ' "$OUT/app-version.json"
          cat "$OUT/app-version.json"

      - name: Publish release
        if: env.ANDROID_KEYSTORE_PATH != '' && steps.rel.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ steps.rel.outputs.version }}
          name: Twain ${{ steps.rel.outputs.version }}
          body_path: mobile/release-notes.txt
          make_latest: true
          files: |
            mobile/android/app/build/outputs/apk/release/Twain.apk
            mobile/android/app/build/outputs/apk/release/app-version.json
            mobile/android/app/build/outputs/bundle/release/app-release.aab

      - uses: actions/upload-artifact@v4
        with:
          name: twain-android
          path: |
            mobile/android/app/build/outputs/apk/release/*.apk
            mobile/android/app/build/outputs/bundle/release/*.aab
