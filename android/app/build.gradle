// Twain Android app: a Trusted Web Activity that opens https://twain-coral.vercel.app full-screen.
// The web app does all the work; this shell gives it a Play Store listing, icon, splash and notifications.
plugins {
    id "com.android.application"
}

def twaHost = "twain-coral.vercel.app"

// Release signing comes from env vars (GitHub Actions secrets or a local build); absent → unsigned release.
def ks = System.getenv("ANDROID_KEYSTORE_PATH")

android {
    namespace "com.g41us.twain"
    compileSdk 36

    defaultConfig {
        applicationId "com.g41us.twain"
        minSdk 24
        targetSdk 36
        versionCode((System.getenv("VERSION_CODE") ?: "1").toInteger())
        versionName(System.getenv("VERSION_NAME") ?: "1.0.0")
        manifestPlaceholders = [hostName: twaHost, launchUrl: "https://" + twaHost + "/swipe"]
        resValue "string", "assetStatements",
            '[{"relation": ["delegate_permission/common.handle_all_urls"], "target": {"namespace": "web", "site": "https://' + twaHost + '"}}]'
    }

    signingConfigs {
        if (ks) {
            release {
                storeFile file(ks)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (ks) signingConfig signingConfigs.release
        }
    }

    buildFeatures { resValues true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "com.google.androidbrowserhelper:androidbrowserhelper:2.7.4"
}
